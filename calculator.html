<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳新高級中學-115新生實驗班甄選成績試算表</title>
    <style>
        :root {
            --primary-color: #e96d5e;
            --primary-hover: #d25648;
            --bg-color: #fcf6f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-calc {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-calc:hover {
            background-color: var(--primary-hover);
        }

        .btn-clear {
            background-color: #6c757d;
            color: white;
        }

        .btn-clear:hover {
            background-color: #5a6268;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
            display: none;
        }

        .result-line {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 5px 0;
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>鳳新高級中學<br>115新生實驗班甄選成績試算表</h2>
    
    <div class="form-group">
        <label for="chinese">國文</label>
        <select id="chinese">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="english">英語</label>
        <select id="english">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="math">數學</label>
        <select id="math">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="science">自然</label>
        <select id="science">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="society">社會</label>
        <select id="society">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="writing">寫作測驗</label>
        <select id="writing">
            <option value="8">六級</option>
            <option value="7">五級</option>
            <option value="6">四級</option>
            <option value="5">三級</option>
            <option value="4">二級</option>
            <option value="3">一級</option>
            <option value="0">零級</option>
        </select>
    </div>

    <div class="form-group">
        <label for="gept">全民英檢</label>
        <select id="gept">
            <option value="0">無</option>
            <option value="0">初級</option>
            <option value="2">中級初試</option>
            <option value="3">中級複試</option>
            <option value="4">中高級初試</option>
            <option value="5">中高級複試</option>
            <option value="6">高級初試</option>
            <option value="7">高級複試</option>
            <option value="8">優級初試</option>
            <option value="9">優級複試</option>
        </select>
    </div>

    <div class="btn-group">
        <button type="button" class="btn-calc" onclick="calculateScores()">計算</button>
        <button type="button" class="btn-clear" onclick="clearForm()">清除</button>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-line" id="mathClassResult"></div>
        <div class="result-line" id="bilingualClassResult"></div>
    </div>
</div>

<script>
function calculateScores() {
    // 獲取各科選單轉換後的分數值 (浮點數以防加權計算精準度)
    const ch = parseFloat(document.getElementById('chinese').value);
    const en = parseFloat(document.getElementById('english').value);
    const math = parseFloat(document.getElementById('math').value);
    const sci = parseFloat(document.getElementById('science').value);
    const soc = parseFloat(document.getElementById('society').value);
    const write = parseFloat(document.getElementById('writing').value);
    const gept = parseFloat(document.getElementById('gept').value);

    // 數班實驗班：國文 + 英語 + 數學*2.5 + 自然*2.7 + 社會 + 寫作測驗
    const mathScore = ch + en + (math * 2.5) + (sci * 2.7) + soc + write;

    // 雙語實驗班：國文*2.2 + 英語*2.5 + 數學 + 自然 + 社會*2.2 + 寫作測驗 + 全民英檢
    const bilingualScore = (ch * 2.2) + (en * 2.5) + math + sci + (soc * 2.2) + write + gept;

    // 顯示結果並四捨五入到小數點後兩位（避免 JavaScript 浮點數誤差，若為整數則會自動顯示整數）
    document.getElementById('mathClassResult').innerText = `數班實驗班分數：${Number(mathScore.toFixed(2))} 分`;
    document.getElementById('bilingualClassResult').innerText = `雙語實驗班分數：${Number(bilingualScore.toFixed(2))} 分`;
    
    // 展現結果區塊
    document.getElementById('resultBox').style.display = 'block';
}

function clearForm() {
    // 將所有下拉選單回復到第一個預設選項
    document.getElementById('chinese').selectedIndex = 0;
    document.getElementById('english').selectedIndex = 0;
    document.getElementById('math').selectedIndex = 0;
    document.getElementById('science').selectedIndex = 0;
    document.getElementById('society').selectedIndex = 0;
    document.getElementById('writing').selectedIndex = 0;
    document.getElementById('gept').selectedIndex = 0;

    // 隱藏結果區塊並清空文字
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('mathClassResult').innerText = '';
    document.getElementById('bilingualClassResult').innerText = '';
}
</script>

</body>
</html>
