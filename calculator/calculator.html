<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳新高級中學-115新生實驗班甄選成績試算表</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1a5f7a;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label {
            font-weight: bold;
            font-size: 16px;
            flex: 1;
        }
        select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            width: 60%;
            box-sizing: border-box;
        }
        .btn-group {
            margin-top: 25px;
            margin-bottom: 25px;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin: 0 10px;
        }
        .btn-calc {
            background-color: #22a6b3;
            color: white;
        }
        .btn-calc:hover {
            background-color: #1b8a95;
        }
        .btn-clear {
            background-color: #95afc0;
            color: white;
        }
        .btn-clear:hover {
            background-color: #7ed6df;
            color: #333;
        }
        .result-box {
            background-color: #f9f9f9;
            border-left: 5px solid #22a6b3;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 0 6px 6px 0;
            text-align: left;
            font-size: 18px;
            line-height: 1.6;
            font-weight: bold;
            display: none; /* 預設隱藏，計算後顯示 */
        }
        .footer-img {
            max-width: 100%;
            height: auto;
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>鳳新高級中學<br>115新生實驗班甄選成績試算表</h1>
    
    <div class="form-group">
        <label for="chinese">國文：</label>
        <select id="chinese">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="english">英語：</label>
        <select id="english">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="math">數學：</label>
        <select id="math">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="science">自然：</label>
        <select id="science">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="society">社會：</label>
        <select id="society">
            <option value="7">A++</option>
            <option value="6">A+</option>
            <option value="5">A</option>
            <option value="4">B++</option>
            <option value="3">B+</option>
            <option value="2">B</option>
            <option value="1">C</option>
        </select>
    </div>

    <div class="form-group">
        <label for="writing">寫作測驗：</label>
        <select id="writing">
            <option value="8">六級</option>
            <option value="7">五級</option>
            <option value="6">四級</option>
            <option value="5">三級</option>
            <option value="4">二級</option>
            <option value="3">一級</option>
            <option value="0">零級</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn-calc" onclick="calculateScores()">計算</button>
        <button class="btn-clear" onclick="clearForm()">清除</button>
    </div>

    <div class="result-box" id="resultBox">
        <div id="mathClassResult"></div>
        <div id="bilingualClassResult"></div>
    </div>

    <img src="haha.png" alt="圖示" class="footer-img">
</div>

<script>
    function calculateScores() {
        // 取得各科下拉選單的分數值 (轉為數字型態)
        const chi = parseFloat(document.getElementById('chinese').value);
        const eng = parseFloat(document.getElementById('english').value);
        const mat = parseFloat(document.getElementById('math').value);
        const sci = parseFloat(document.getElementById('science').value);
        const soc = parseFloat(document.getElementById('society').value);
        const wrt = parseFloat(document.getElementById('writing').value);

        // 數班實驗班分數 = 國文 + 英語 + 數學*2.5 + 自然*2.7 + 社會 + 寫作測驗
        const mathScore = chi + eng + (mat * 2.5) + (sci * 2.7) + soc + wrt;

        // 雙語實驗班分數 = 國文*2.2 + 英語*2.5 + 數學 + 自然 + 社會*2.2 + 寫作測驗
        const bilingualScore = (chi * 2.2) + (eng * 2.5) + mat + sci + (soc * 2.2) + wrt;

        // 四捨五入到小數點後第二位（避免 JavaScript 浮點數運算出錯）
        const finalMath = Math.round(mathScore * 100) / 100;
        const finalBilingual = Math.round(bilingualScore * 100) / 100;

        // 顯示結果
        document.getElementById('mathClassResult').innerText = "數班實驗班分數：" + finalMath + " 分";
        document.getElementById('bilingualClassResult').innerText = "雙語實驗班分數：" + finalBilingual + " 分";
        document.getElementById('resultBox').style.display = "block";
    }

    function clearForm() {
        // 將所有下拉選單重設回第一個選項
        document.getElementById('chinese').selectedIndex = 0;
        document.getElementById('english').selectedIndex = 0;
        document.getElementById('math').selectedIndex = 0;
        document.getElementById('science').selectedIndex = 0;
        document.getElementById('society').selectedIndex = 0;
        document.getElementById('writing').selectedIndex = 0;

        // 隱藏結果區並清空文字
        document.getElementById('resultBox').style.display = "none";
        document.getElementById('mathClassResult').innerText = "";
        document.getElementById('bilingualClassResult').innerText = "";
    }
</script>

</body>
</html>
