<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳新高級中學-115新生實驗班甄選成績試算表</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f5f7fa;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            max-width: 600px;
            width: 90%;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent-color);
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            color: #4a5568;
            flex: 1;
        }

        select {
            flex: 2;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-calc {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-calc:hover {
            background-color: #2980b9;
        }

        .btn-clear {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .btn-clear:hover {
            background-color: #cbd5e0;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #ebf8ff;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            display: none;
        }

        .result-line {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 8px 0;
        }

        /* 滿版圖片設定：獨立於表單之外，寬度滿版 */
        .full-width-img {
            width: 100%;
            height: auto;
            display: block;
            margin-top: auto; /* 推至最下方 */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>鳳新高級中學-115新生實驗班甄選成績試算表</h1>
        
        <form id="scoreForm">
            <div class="form-group">
                <label for="chinese">國文</label>
                <select id="chinese" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5" selected>A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="english">英語</label>
                <select id="english" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5" selected>A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="math">數學</label>
                <select id="math" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5" selected>A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="science">自然</label>
                <select id="science" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5" selected>A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="society">社會</label>
                <select id="society" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5" selected>A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="writing">寫作測驗</label>
                <select id="writing" required>
                    <option value="8">六級</option>
                    <option value="7">五級</option>
                    <option value="6" selected>四級</option>
                    <option value="5">三級</option>
                    <option value="4">二級</option>
                    <option value="3">一級</option>
                    <option value="0">零級</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-calc" onclick="calculateScores()">計算</button>
                <button type="button" class="btn-clear" onclick="clearForm()">清除</button>
            </div>
        </form>

        <div id="resultBox" class="result-box">
            <div class="result-line" id="mathClassResult"></div>
            <div class="result-line" id="bilingualClassResult"></div>
        </div>
    </div>

    <img src="haha.png" alt="Footer Image" class="full-width-img">

    <script>
        function calculateScores() {
            // 取得各科分數（轉換為數字）
            const ch = Number(document.getElementById('chinese').value);
            const eng = Number(document.getElementById('english').value);
            const math = Number(document.getElementById('math').value);
            const sci = Number(document.getElementById('science').value);
            const soc = Number(document.getElementById('society').value);
            const writ = Number(document.getElementById('writing').value);

            // 計算數班實驗班分數：國文+英語+數學*2.5+自然*2.7+社會+寫作測驗
            // 由於浮點數計算可能會有小數點誤差，使用 Math.round 四捨五入處理
            const mathScore = Math.round((ch + eng + (math * 2.5) + (sci * 2.7) + soc + writ) * 10) / 10;

            // 計算雙語實驗班分數：國文*2.2+英語*2.5+數學+自然+社會*2.2+寫作測驗
            const bilingualScore = Math.round(((ch * 2.2) + (eng * 2.5) + math + sci + (soc * 2.2) + writ) * 10) / 10;

            // 顯示結果
            document.getElementById('mathClassResult').innerText = `數班實驗班分數：${mathScore} 分`;
            document.getElementById('bilingualClassResult').innerText = `雙語實驗班分數：${bilingualScore} 分`;
            document.getElementById('resultBox').style.display = 'block';
        }

        function clearForm() {
            // 重設表單至預設值
            document.getElementById('scoreForm').reset();
            // 隱藏結果區
            document.getElementById('resultBox').style.display = 'none';
        }
    </script>
</body>
</html>
