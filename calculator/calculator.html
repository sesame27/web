<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳新高級中學-115新生實驗班甄選成績試算表</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            color: #1a5f7a;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label {
            font-weight: bold;
            flex: 1;
        }
        select {
            flex: 1.5;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-calc {
            background-color: #1a5f7a;
            color: white;
        }
        .btn-calc:hover {
            background-color: #124559;
        }
        .btn-clear {
            background-color: #e0e0e0;
            color: #333;
        }
        .btn-clear:hover {
            background-color: #d0d0d0;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            border-left: 5px solid #1a5f7a;
            background-color: #f9f9f9;
            font-size: 18px;
            line-height: 1.8;
            font-weight: bold;
            display: none;
        }
        /* 圖片 RWD 自適應設定 */
        .bottom-img {
            margin-top: 40px;
            display: block;
            height: auto;
            /* 手機板預設：100% 螢幕寬度 */
            width: 100vw; 
            max-width: 100%; 
        }
        /* 電腦版設定 (螢幕寬度大於 768px 時) */
        @media (min-width: 768px) {
            .bottom-img {
                width: 70vw;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>鳳新高級中學<br>115新生實驗班甄選成績試算表</h1>
        
        <form id="scoreForm">
            <div class="form-group">
                <label for="chinese">國文：</label>
                <select id="chinese" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5">A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="english">英語：</label>
                <select id="english" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5">A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="math">數學：</label>
                <select id="math" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5">A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="science">自然：</label>
                <select id="science" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5">A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="society">社會：</label>
                <select id="society" required>
                    <option value="7">A++</option>
                    <option value="6">A+</option>
                    <option value="5">A</option>
                    <option value="4">B++</option>
                    <option value="3">B+</option>
                    <option value="2">B</option>
                    <option value="1">C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="writing">寫作測驗：</label>
                <select id="writing" required>
                    <option value="8">六級</option>
                    <option value="7">五級</option>
                    <option value="6">四級</option>
                    <option value="5">三級</option>
                    <option value="4">二級</option>
                    <option value="3">一級</option>
                    <option value="0">零級</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-calc" onclick="calculateScores()">計算</button>
                <button type="button" class="btn-clear" onclick="clearForm()">清除</button>
            </div>
        </form>

        <div id="result"></div>
    </div>

    <img src="haha.jpg" alt="展示圖片" class="bottom-img">

    <script>
        function calculateScores() {
            // 取得各科分數 (並轉換為數字型態)
            const chi = Number(document.getElementById('chinese').value);
            const eng = Number(document.getElementById('english').value);
            const mat = Number(document.getElementById('math').value);
            const sci = Number(document.getElementById('science').value);
            const soc = Number(document.getElementById('society').value);
            const wrt = Number(document.getElementById('writing').value);

            // 計算公式
            // 數班：國文 + 英語 + 數學*2.5 + 自然*2.7 + 社會 + 寫作測驗
            const mathClassScore = chi + eng + (mat * 2.5) + (sci * 2.7) + soc + wrt;
            
            // 雙語班：國文*2.2 + 英語*2.5 + 數學 + 自然 + 社會*2.2 + 寫作測驗
            const bilingualClassScore = (chi * 2.2) + (eng * 2.5) + mat + sci + (soc * 2.2) + wrt;

            // 顯示結果 (Math.round 用於處理浮點數計算可能產生的微小誤差，維持美觀，可視需求調整)
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `數班實驗班分數：${mathClassScore.toFixed(1)} 分<br>雙語實驗班分數：${bilingualClassScore.toFixed(1)} 分`;
            resultDiv.style.display = 'block';
        }

        function clearForm() {
            // 重設表單回預設第一個選項
            document.getElementById('scoreForm').reset();
            // 隱藏並清空結果欄
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';
            resultDiv.style.display = 'none';
        }
    </script>
</body>
</html>
